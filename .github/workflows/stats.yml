name: Update Stats Card

on:
  # Refresh four times a day
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  # Regenerate on every push to main
  push:
    branches:
      - master
      - main

jobs:
  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/stats.svg)" ]; then
            git add assets/stats.svg
            git commit -m "chore: refresh stats card [skip ci]"
            git push
          else
            echo "No change in stats card."
          fi
